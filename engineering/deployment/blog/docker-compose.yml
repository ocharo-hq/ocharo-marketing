# One OcharoBlog instance per environment. Bring up from engineering/deployment/:
#
#   docker compose up -d --build
#
# The SQLite store lives on the named volume so data survives container replacement.
services:
  ocharoblog:
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    image: ocharoblog
    container_name: ocharoblog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8080"
    volumes:
      - ocharoblog-data:/data

volumes:
  ocharoblog-data:
