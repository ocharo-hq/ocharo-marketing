# Local packaging reference; Wheelhouse deploys the image from deploy.yml instead. The container needs Identity:Client:*
# and Marketing:OrganizationId, which this file does not set, and an explicit profile keeps ordinary compose startup from
# launching it. SQLite and private blobs share the named volume.
services:
  ocharomarketing:
    build:
      context: ../codebase
      dockerfile: ../deployment/Dockerfile
    image: ocharomarketing
    container_name: ocharomarketing
    profiles: ["future-host"]
    restart: "no"
    ports:
      - "127.0.0.1:8277:8080"
    volumes:
      - ocharomarketing-data:/data

volumes:
  ocharomarketing-data:
