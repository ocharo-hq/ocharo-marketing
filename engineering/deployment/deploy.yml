# yaml-language-server: $schema=../../../../../../../../../conventions/deployment/descriptor/deploy.schema.json
# What this product deploys: its sites, its services, how each builds, what changes it and which paths it serves.
# Format and rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md. Hostnames, secrets and
# environments live in Wheelhouse targets, never here. Paths are relative to engineering/.
#
# Ocharo Marketing deploys the Marketing desk and the Editorial (Blog) host as a repository of the one `ocharo` product
# (Wheelhouse decision 70), so its service, site and volume names stay unique across Ocharo's repositories. Both sign in
# through Ocharo's Identity, which ocharo-platform's descriptor declares (deployment.md § Wheelhouse). Each keeps its state
# in the product database (`ocharo_{env}`, shared with Desk and Identity): Marketing in schema `marketing`, its sessions in
# `marketing_cache`; Blog in `blog` and `blog_cache`. Data Protection key rings live in each app's schema, so a restart or
# deploy keeps everyone signed in. Each volume keeps the retired SQLite store and the blobs stored before WoW2 Files.
# The SQLite data moves once per environment, after the deploy that brings PostgreSQL, with each image's
# `import-sqlite --dry-run` then `import-sqlite` (deployment.md § PostgreSQL move); until then data routes answer 503. The product's name and description come from Ocharo's catalog entry (a product of
# several repositories); this file names only its two services.
descriptor: 2
product: ocharo
dotnetEnvironment: true                 # dev runs as .NET Development, prod as Production
# The end-to-end check after a dev rollout, from the marketing image (it has curl): both hosts' boot-bundle health, the
# desk's status and the public Blog home. Wheelhouse runs the first repository's check for the release set.
verify:
  service: marketing
  command:
    - sh
    - -c
    - >-
      curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_MARKETING/health"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_MARKETING/api/system/status"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_BLOG/health"
      && curl --fail --silent --show-error --max-time 10 --header "Host: localhost" --output /dev/null
      "$VERIFY_SERVICE_BLOG/"
      && echo "marketing and blog answered health, status and the Blog home"
  timeout: 1m
# Each image applies its own sets before any service restarts: Marketing's `marketing` set and Blog's `blog` set, each
# with its session cache's `distributed_cache` set in `marketing_cache` / `blog_cache`. The sets key into Identity's
# published organizations and people, so ocharo-platform's identity item runs first; Wheelhouse fills
# Migrations:ConnectionString from the target's database.
migrate:
  - service: marketing
    command: [dotnet, OcharoMarketing.Api.dll, migrate]
    timeout: 5m
  - service: blog
    command: [dotnet, OcharoBlog.Api.dll, migrate]
    timeout: 5m
# Each service checks the settings the deploy applies before any restart (ServiceHost's built-in verb).
configCheck:
  - service: marketing
    command: [dotnet, OcharoMarketing.Api.dll, config, check]
  - service: blog
    command: [dotnet, OcharoBlog.Api.dll, config, check]
sites:
  marketing: {}                         # the Marketing desk, behind sign-in; /api/public stays anonymous
  blog: {}                              # the public Blog site, and its /studio/ editor behind sign-in
services:
  marketing:
    name: Marketing
    description: The desk where Ocharo plans, renders and delivers its posts and reads its leads.
    build: { dockerfile: deployment/Dockerfile }
    paths:
      - codebase/ocharo-marketing.backend-services/**
      - codebase/ocharo-marketing.frontend-services/**
    health: /health
    settings:
      # Wheelhouse derives AllowedHosts and Deployment:TrustedProxies (the ingress, whose forwarded scheme the
      # same-origin write check needs), and fills DatabaseSettings:ConnectionString from the target's own PostgreSQL;
      # nobody types them.
      required: [DatabaseSettings:ConnectionString, AllowedHosts, Deployment:TrustedProxies]
      keys:
        # Sign-in through Ocharo's Identity as client 3, whose keys ocharo-platform's descriptor declares; reads need
        # membership of the bound organization, writes marketing:edit, publication actions marketing:approve.
        Identity:Client:Authority: { from: { repository: platform, key: Sites:identity:Url } }
        Identity:Client:ClientId: { default: marketing }
        Identity:Client:ClientSecret: { from: { repository: platform, key: Identity:Server:Clients:3:ClientSecret } }
        Identity:Client:CookieName: { default: __Host-ocharo-marketing }
        Identity:Client:SignalUrl: { from: { repository: platform, key: Identity:Server:Clients:3:SignalUrl } }
        Identity:Client:PostSignOutRedirectPath: { default: "/" }
        Marketing:OrganizationId: { required: true }         # Ocharo's organization id in that environment's Identity
        # The Catalogue and Blog origins the catalogue sync and story picker read, each linked to its site.
        Marketing:CatalogueBaseUrl: { from: { repository: platform, key: Sites:catalogue:Url } }
        Marketing:BlogBaseUrl: { from: Sites:blog:Url }
        # Assets and export ZIPs live in WoW2 Files, tenant `ocharo` on the shared files host, reached with client 3: a
        # member's exchanged token within their session, Marketing's own for the worker, seed and backfill; linked to the
        # Uri ocharo-platform types for its Files resource. Blobs stored before Files read from marketing-data until the
        # migration (files-migration.yml).
        Files:BaseUrl: { from: { repository: platform, key: Identity:Server:Resources:2:Uri } }
        # The Ocharo app menu, served anonymously at /api/runtime-config; an unset key leaves that app out.
        OcharoApps:Desk: { from: { repository: platform, key: Sites:desk:Url } }
        OcharoApps:Catalogue: { from: { repository: platform, key: Sites:catalogue:Url } }
        OcharoApps:Studio: { from: { repository: studio, key: Sites:studio:Url } }
        OcharoApps:Marketing: { from: Sites:marketing:Url }
        OcharoApps:Editorial: { type: url }
        OcharoApps:Brand: { from: { repository: platform, key: Sites:brand:Url } }
        OcharoApps:Atlas: { type: url }
        OcharoApps:Wear: { type: url }
        OcharoApps:Blog: { from: Sites:blog:Url }
    needs: [postgres]
    volumes:
      marketing-data: /data             # the SQLite store until import-sqlite retires it, and blobs stored before Files
    sites:
      marketing: {}
  blog:
    name: Blog
    description: Ocharo's public Blog and the Editorial studio where its stories are written.
    build: { dockerfile: deployment/blog/Dockerfile }
    paths:
      - codebase/ocharo-blog.backend-services/**
      - codebase/ocharo-marketing.frontend-services/**   # the /studio/ editor is apps/editorial of this workspace
    health: /health
    settings:
      required: [DatabaseSettings:ConnectionString, AllowedHosts, Deployment:TrustedProxies]
      keys:
        # The /studio/ editor signs in through Ocharo's Identity as client 4, whose keys ocharo-platform's descriptor
        # declares; reads need membership of the bound organization, writes editorial:edit, publication actions
        # editorial:approve. The public site stays anonymous, and signing out lands on it.
        Identity:Client:Authority: { from: { repository: platform, key: Sites:identity:Url } }
        Identity:Client:ClientId: { default: editorial }
        Identity:Client:ClientSecret: { from: { repository: platform, key: Identity:Server:Clients:4:ClientSecret } }
        Identity:Client:CookieName: { default: __Host-ocharo-editorial }
        Identity:Client:SignalUrl: { from: { repository: platform, key: Identity:Server:Clients:4:SignalUrl } }
        Identity:Client:PostSignOutRedirectPath: { default: "/" }
        # Service tokens: Editorial's audience for live exports, and the Desk it calls as itself for background removal.
        Identity:Resource:Uri: { from: Sites:blog:Url }
        Identity:Resource:SignalUrl: { from: { repository: platform, key: Identity:Server:Resources:1:SignalUrl } }
        Blog:DeskBaseUrl: { from: { repository: platform, key: Sites:desk:Url } }
        Blog:OrganizationId: { required: true }              # Ocharo's organization id in that environment's Identity
        # The Brand, Catalogue and Marketing origins the public renderer and enquiry relay read, each linked to its site.
        Blog:BrandBaseUrl: { from: { repository: platform, key: Sites:brand:Url } }
        Blog:CatalogueBaseUrl: { from: { repository: platform, key: Sites:catalogue:Url } }
        Blog:MarketingBaseUrl: { from: Sites:marketing:Url }
        # Media live in WoW2 Files, tenant `ocharo` on the shared files host, reached with client 4: an editor's exchanged
        # token within their session, Editorial's own otherwise; linked to the Uri ocharo-platform types for its Files
        # resource. Media stored before Files read from blog-data until the migration (files-migration.yml).
        Files:BaseUrl: { from: { repository: platform, key: Identity:Server:Resources:2:Uri } }
        OcharoApps:Desk: { from: { repository: platform, key: Sites:desk:Url } }
        OcharoApps:Catalogue: { from: { repository: platform, key: Sites:catalogue:Url } }
        OcharoApps:Studio: { from: { repository: studio, key: Sites:studio:Url } }
        OcharoApps:Marketing: { from: Sites:marketing:Url }
        OcharoApps:Editorial: { type: url }
        OcharoApps:Brand: { from: { repository: platform, key: Sites:brand:Url } }
        OcharoApps:Atlas: { type: url }
        OcharoApps:Wear: { type: url }
        OcharoApps:Blog: { from: Sites:blog:Url }
    needs: [postgres]
    volumes:
      blog-data: /data                  # the SQLite store until import-sqlite retires it, and blobs stored before Files
    sites:
      blog: {}
