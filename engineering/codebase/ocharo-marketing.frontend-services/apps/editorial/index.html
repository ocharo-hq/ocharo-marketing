<!doctype html>
<!-- `theme-ocharo` applies the fe SDK's Ocharo theme; the pre-paint script adds `dark` beside it. -->
<html lang="uz" class="theme-ocharo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- The SDK pre-paint colour script, generated by vite.config.ts: applies the remembered scheme before the first paint. -->
    <script src="%BASE_URL%theme.js"></script>
    <link rel="stylesheet" href="%BASE_URL%boot-splash.css" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)" />
    <title>Ocharo Editorial</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <!-- The splash before any script runs; mounting the app replaces it with BootSplash, which looks the same. -->
      <div class="boot-splash" role="status" aria-label="Yuklanmoqda…">
        <img
          class="boot-splash-wordmark boot-splash-wordmark-ink"
          src="%BASE_URL%ocharo-wordmark-ink.png"
          alt="Ocharo"
          width="119"
          height="40"
        />
        <img
          class="boot-splash-wordmark boot-splash-wordmark-reverse"
          src="%BASE_URL%ocharo-wordmark-reverse.png"
          alt="Ocharo"
          width="119"
          height="40"
        />
        <div class="boot-splash-track"><div class="boot-splash-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap/main.ts"></script>
  </body>
</html>
