name: Verify Ocharo Marketing

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: marketing-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [web, editorial]
    defaults:
      run:
        working-directory: engineering/codebase/ocharo-marketing.frontend-services
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: engineering/codebase/ocharo-marketing.frontend-services/.nvmrc
          cache: pnpm
          cache-dependency-path: engineering/codebase/ocharo-marketing.frontend-services/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify frontend
        env:
          APP: ${{ matrix.app }}
        run: |
          pnpm --filter "@ocharomarketing/$APP" lint
          pnpm --filter "@ocharomarketing/$APP" format:check
          pnpm --filter "@ocharomarketing/$APP" typecheck
          pnpm --filter "@ocharomarketing/$APP" test
          pnpm --filter "@ocharomarketing/$APP" build

  public-artifacts:
    name: Public artifact packaging (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [atlas, wear, blog, catalogue]
    defaults:
      run:
        working-directory: engineering/codebase/ocharo-marketing.frontend-services
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: engineering/codebase/ocharo-marketing.frontend-services/.nvmrc
          cache: pnpm
          cache-dependency-path: engineering/codebase/ocharo-marketing.frontend-services/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify builder using isolated export fixtures
        # These exercise export packaging, not authenticated publication or live content.
        env:
          APP: ${{ matrix.app }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, tempfile, zipfile
          from pathlib import Path
          app = os.environ['APP']
          with tempfile.TemporaryDirectory() as directory:
              archive = Path(directory) / 'published-fixture.zip'
              with zipfile.ZipFile(archive, 'w') as bundle:
                  bundle.writestr('index.html', '<!doctype html><title>CI fixture</title><small data-app-version>dev</small>')
                  bundle.writestr('publication.json', json.dumps({'publication': app, 'locale': 'en'}))
                  if app == 'blog':
                      bundle.writestr('site.css', 'body { color: #141416; }')
                      bundle.writestr('feed.xml', '<rss version="2.0"></rss>')
              environment = {**os.environ, 'OCHARO_EXPORT_ARCHIVE': str(archive), 'APP_VERSION': 'dev'}
              if app == 'catalogue':
                  environment['OCHARO_CATALOGUE_LOCALE'] = 'en'
              subprocess.run(['pnpm', '--filter', f'@ocharomarketing/{app}', 'build'], env=environment, check=True)
              target = Path('apps') / app / 'dist'
              manifest = json.loads((target / 'build-manifest.json').read_text())
              assert manifest['publication'] == app and manifest['source'] == 'published-revisions'
              assert manifest['exportSha256'] == hashlib.sha256(archive.read_bytes()).hexdigest()
              assert (target / 'index.html').is_file()
          PY

  backend:
    name: Backend (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ocharo-marketing
            solution: OcharoMarketing.BackendServices.slnx
          - app: ocharo-blog
            solution: OcharoBlog.BackendServices.slnx
    defaults:
      run:
        working-directory: engineering/codebase/${{ matrix.app }}.backend-services
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - name: Restore and build backend
        env:
          SOLUTION: ${{ matrix.solution }}
        # Neither solution currently declares NuGet lockfiles. SPA packaging is verified in image jobs.
        run: |
          python3 shared/sync-sso.py --check
          dotnet restore "$SOLUTION"
          dotnet build "$SOLUTION" -c Release --no-restore -p:BuildSpa=false
      - name: Install card rendering browser and Linux dependencies
        if: matrix.app == 'ocharo-marketing'
        run: pwsh tests/OcharoMarketing.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Execute all backend tests
        env:
          SOLUTION: ${{ matrix.solution }}
        run: dotnet test "$SOLUTION" -c Release --no-build -p:BuildSpa=false

  images:
    name: Container (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: marketing
            dockerfile: engineering/deployment/Dockerfile
            compose: engineering/deployment/docker-compose.yml
          - app: editorial
            dockerfile: engineering/deployment/blog/Dockerfile
            compose: engineering/deployment/blog/docker-compose.yml
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Validate deployment composition
        env:
          COMPOSE_FILE: ${{ matrix.compose }}
        run: docker compose --file "$COMPOSE_FILE" config --quiet
      - name: Build image without publishing or starting services
        env:
          APP: ${{ matrix.app }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "ocharo-ci:$APP" --build-arg "VCS_REF=$GITHUB_SHA" engineering/codebase

  verify:
    name: verify
    if: always()
    needs: [frontend, public-artifacts, backend, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(result != 'success' for result in results):
              raise SystemExit(f'Verification jobs did not all pass: {results}')
          PY
